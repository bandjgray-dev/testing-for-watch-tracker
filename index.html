<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background: linear-gradient(145deg, #e4eae1 0%, #d8e2d4 50%, #ccd8c8 100%);
            color: #2b3630;
            min-height: 100vh;
        }

        .glass-watch-card {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 10px 25px -3px rgba(45, 65, 50, 0.08), 0 4px 6px -4px rgba(45, 65, 50, 0.04);
        }

        .glass-inner {
            background: rgba(240, 245, 238, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        /* Pill bar notch masking with perfectly rounded contour radius */
        .top-nav-bar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 12px 30px -4px rgba(45, 65, 50, 0.12);
            mask-image: radial-gradient(circle 26px at 50% 0px, transparent 26px, black 27px);
            -webkit-mask-image: radial-gradient(circle 26px at 50% 0px, transparent 26px, black 27px);
        }

        .floating-add-btn {
            background: linear-gradient(135deg, #476a55 0%, #355241 100%);
            box-shadow: 0 10px 20px -3px rgba(40, 65, 50, 0.4);
        }
    </style>
</head>
<body class="pb-12 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 pt-3 space-y-3">

        <!-- Upper Header: Watch Vault Left + Portfolio Value Right -->
        <div class="flex items-center justify-between px-1">
            <h1 class="text-xl font-bold text-slate-900 flex items-center gap-1.5">
                <span>⌚</span> Watch Vault
            </h1>
            <div class="glass-watch-card px-3.5 py-1 rounded-full text-xs font-semibold text-slate-700 flex items-center gap-1.5 shadow-sm">
                <span class="text-[10px] uppercase font-bold text-slate-500">Portfolio Value:</span>
                <span id="headerTotalVal" class="font-extrabold text-emerald-900">$0</span>
            </div>
        </div>
        <!-- Add Watch Label Above & Clean Floating Button -->
        <div class="relative pt-5 pb-1">
            <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-30 flex flex-col items-center">
                <span class="text-[10px] font-extrabold tracking-wider text-emerald-900 mb-0.5">Add Watch</span>
                <button onclick="openModal()" class="floating-add-btn w-12 h-12 rounded-full text-white font-bold text-2xl flex items-center justify-center active:scale-95 transition-all">
                    +
                </button>
            </div>

            <!-- Top Action Pill Bar -->
            <div class="top-nav-bar relative flex items-center justify-between py-3 px-6 rounded-full z-20 mt-1">
                <button onclick="exportBackup()" class="text-xs font-bold text-slate-700 hover:text-emerald-900 flex items-center gap-1 active:scale-95 transition-all">
                    <span>📥</span> Backup
                </button>
                <div class="w-12"></div>
                <button onclick="document.getElementById('importFile').click()" class="text-xs font-bold text-slate-700 hover:text-emerald-900 flex items-center gap-1 active:scale-95 transition-all">
                    <span>📤</span> Restore
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </div>

        <!-- Swipeable Category Pill Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="catFilters">
            <button onclick="setFilter('All', this)" class="filter-btn active floating-add-btn text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap shadow-md transition-all">All</button>
            <button onclick="setFilter('Diver', this)" class="filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all">Diver</button>
            <button onclick="setFilter('Dress', this)" class="filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all">Vintage</button>
        </div>

        <!-- Search Bar -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderWatches()" placeholder="Search brand, model, serial..." class="w-full glass-watch-card text-slate-800 placeholder-slate-400 text-xs rounded-2xl pl-9 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
            <span class="absolute left-3.5 top-3.5 text-slate-400 text-xs">🔍</span>
        </div>

        <!-- Watch Cards Container -->
        <div id="watchList" class="space-y-3 pt-1"></div>
    </div>
    <!-- Add / Edit Watch Modal -->
    <div id="watchModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white/85 backdrop-blur-xl border border-white/80 text-slate-800 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-3">
            <div class="flex justify-between items-center mb-1">
                <h2 id="modalTitle" class="text-lg font-bold text-slate-900">Add Watch</h2>
                <button type="button" id="deleteWatchBtn" onclick="deleteCurrentEditingWatch()" class="hidden bg-red-100 hover:bg-red-200 text-red-700 font-bold text-xs px-3 py-1.5 rounded-xl transition-all">Delete Watch</button>
            </div>
            <form id="watchForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="watchId">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Brand</label>
                        <input type="text" id="brand" required placeholder="Rolex" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Model</label>
                        <input type="text" id="model" required placeholder="Submariner" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Category</label>
                        <select id="category" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                            <option value="Diver">Diver</option>
                            <option value="Dress">Dress</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Field">Field</option>
                            <option value="Vintage">Vintage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Value ($)</label>
                        <input type="number" id="currentValue" placeholder="14500" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Movement</label>
                        <input type="text" id="movementType" placeholder="Automatic 3235" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" placeholder="X829F114" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Case Size</label>
                        <input type="text" id="caseSize" placeholder="41mm" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Lug Width</label>
                        <input type="text" id="lugWidth" placeholder="20mm" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Crystal Type</label>
                        <input type="text" id="crystalType" placeholder="Sapphire" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Band Material</label>
                        <input type="text" id="bandMaterial" placeholder="Steel Oyster" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Water Resistance</label>
                        <input type="text" id="waterResistance" placeholder="300m" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Case Material</label>
                        <input type="text" id="caseMaterial" placeholder="Stainless Steel" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Purchase Date</label>
                        <input type="date" id="purchaseDate" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Purchase Price ($)</label>
                        <input type="number" id="purchasePrice" placeholder="10200" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Asking Price ($)</label>
                        <input type="number" id="askingPrice" placeholder="15000" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Mfg Date / Year</label>
                        <input type="text" id="dateOfManufacture" placeholder="2022" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</label>
                    <textarea id="description" rows="2" class="w-full glass-inner rounded-xl px-3 py-2 text-sm text-slate-800 focus:outline-none focus:ring-2 focus:ring-emerald-700/30"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Images</label>
                    <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)" class="w-full text-xs text-slate-600 file:mr-2 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-emerald-800 file:text-white hover:file:bg-emerald-900">
                    <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-2"></div>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="glass-watch-card text-slate-600 font-semibold text-xs px-4 py-2.5 rounded-xl">Cancel</button>
                    <button type="submit" class="floating-add-btn text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md">Save Watch</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Detail View Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-white/85 backdrop-blur-xl border border-white/80 text-slate-800 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex justify-end items-center">
                <button onclick="closeDetailModal()" class="glass-watch-card text-slate-500 hover:text-slate-900 w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">&times;</button>
            </div>
            
            <div id="detImagesContainer" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

            <div>
                <h2 id="detTitle" class="text-lg font-bold text-slate-900 tracking-wide"></h2>
            </div>

            <div class="grid grid-cols-2 gap-2 glass-inner p-3 rounded-2xl text-xs">
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Estimated Value</span><span id="detVal" class="text-emerald-800 font-bold text-base"></span></div>
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Purchase Price</span><span id="detPurchase" class="text-slate-700 font-bold text-base"></span></div>
            </div>

            <div id="detSpecsSection"></div>

            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</h4>
                <p id="detDesc" class="text-xs text-slate-700 leading-relaxed glass-inner p-3 rounded-2xl"></p>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="detEditBtn" class="flex-1 glass-watch-card text-slate-700 font-semibold text-xs py-2.5 rounded-xl transition-all">Edit Watch</button>
                <button type="button" id="detShareBtn" class="flex-1 floating-add-btn text-white font-semibold text-xs py-2.5 rounded-xl transition-all">Share / Export</button>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightboxModal" class="hidden fixed inset-0 bg-slate-950/90 z-[100] items-center justify-center p-2" onclick="closeLightbox()">
        <button class="absolute top-4 right-4 bg-white/20 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center backdrop-blur-md">&times;</button>
        <img id="lightboxImg" src="" class="max-w-full max-h-full object-contain rounded-2xl shadow-2xl">
    </div>

    <!-- Share Modal -->
    <div id="shareModal" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-md z-50 items-center justify-center p-4">
        <div class="bg-white/85 backdrop-blur-xl border border-white/80 text-slate-800 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-slate-900">Share / Export Options</h3>
            <div id="shareOptionsBox" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-600 pr-1"></div>
            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="executeShareText()" class="w-full glass-watch-card text-slate-800 font-semibold text-xs py-2.5 rounded-xl">Share Text (SMS / App)</button>
                <button type="button" onclick="executeEmailReport()" class="w-full floating-add-btn text-white font-semibold text-xs py-2.5 rounded-xl">Email Details</button>
                <button type="button" onclick="executeGeneratePDF()" class="w-full bg-emerald-900 text-white font-semibold text-xs py-2.5 rounded-xl">Download Spec Sheet</button>
                <button type="button" onclick="closeShareModal()" class="w-full glass-inner text-slate-600 font-semibold text-xs py-2 rounded-xl mt-1">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                category: "Diver",
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                caseSize: "41mm",
                lugWidth: "20mm",
                crystalType: "Sapphire",
                bandMaterial: "Steel Oyster",
                waterResistance: "300m",
                caseMaterial: "Stainless Steel",
                purchaseDate: "2023-01-15",
                purchasePrice: "10200",
                askingPrice: "15000",
                dateOfManufacture: "2022",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"]
            }
        ];

        var stored = localStorage.getItem('watches_v15');
        var watches = [];
        try {
            watches = stored ? JSON.parse(stored) : defaultWatches;
            if (!Array.isArray(watches)) watches = defaultWatches;
        } catch(e) {
            watches = defaultWatches;
        }
        localStorage.setItem('watches_v15', JSON.stringify(watches));

        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;

        function saveWatches() {
            localStorage.setItem('watches_v15', JSON.stringify(watches));
            renderWatches();
        }

        function updateHeaderTotal() {
            var total = watches.reduce(function(acc, item) {
                var val = parseFloat(item.currentValue) || 0;
                return acc + val;
            }, 0);
            var totalEl = document.getElementById('headerTotalVal');
            if (totalEl) {
                totalEl.innerText = '$' + total.toLocaleString('en-US');
            }
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn glass-watch-card text-slate-700 hover:text-slate-900 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap transition-all';
            });
            element.className = 'filter-btn active floating-add-btn text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap shadow-md transition-all';
            renderWatches();
        }
        function renderWatches() {
            updateHeaderTotal();

            var container = document.getElementById('watchList');
            container.innerHTML = '';

            var searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();

            var filtered = watches.filter(function(w) {
                var matchesCat = activeCategoryFilter === 'All' || w.category === activeCategoryFilter;
                var matchesSearch = !searchVal || 
                    (w.brand && w.brand.toLowerCase().includes(searchVal)) ||
                    (w.model && w.model.toLowerCase().includes(searchVal)) ||
                    (w.serialNumber && w.serialNumber.toLowerCase().includes(searchVal));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 glass-watch-card rounded-3xl shadow-md">
                        <p class="text-slate-500 text-xs">No watches found</p>
                    </div>`;
                return;
            }

            filtered.forEach(function(w) {
                var card = document.createElement('div');
                card.className = 'glass-watch-card rounded-3xl p-4 flex items-center justify-between cursor-pointer hover:bg-white/80 transition-all active:scale-[0.99]';
                card.onclick = function() { openDetailModal(w.id); };

                var imgUrl = (w.images && w.images.length > 0) ? w.images[0] : 'https://via.placeholder.com/100?text=Watch';
                var valStr = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : 'N/A';

                card.innerHTML = `
                    <div class="flex items-center gap-3.5 min-w-0">
                        <img src="${imgUrl}" class="w-14 h-14 object-cover rounded-2xl glass-inner flex-shrink-0 shadow-sm">
                        <div class="min-w-0">
                            <span class="text-[9px] font-bold uppercase tracking-wider text-emerald-800 bg-emerald-950/5 px-2 py-0.5 rounded-full">${w.category || 'Watch'}</span>
                            <h3 class="text-sm font-bold text-slate-900 truncate mt-0.5">${w.brand || ''} ${w.model || ''}</h3>
                            <p class="text-[11px] text-slate-500 truncate">SN: ${w.serialNumber || 'N/A'} • ${w.caseSize || 'N/A'}</p>
                        </div>
                    </div>
                    <div class="text-right flex-shrink-0 pl-2">
                        <span class="text-xs font-extrabold text-emerald-900 block">${valStr}</span>
                        <span class="text-[10px] text-slate-400 font-semibold">❯</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function openModal(watchId) {
            var modal = document.getElementById('watchModal');
            var form = document.getElementById('watchForm');
            var deleteBtn = document.getElementById('deleteWatchBtn');
            form.reset();
            currentTempImages = [];

            if (watchId) {
                document.getElementById('modalTitle').innerText = 'Edit Watch';
                deleteBtn.classList.remove('hidden');
                deleteBtn.classList.add('block');
                var w = watches.find(function(item) { return item.id === watchId; });
                if (w) {
                    document.getElementById('watchId').value = w.id;
                    document.getElementById('brand').value = w.brand || '';
                    document.getElementById('model').value = w.model || '';
                    document.getElementById('category').value = w.category || 'Diver';
                    document.getElementById('currentValue').value = w.currentValue || '';
                    document.getElementById('movementType').value = w.movementType || '';
                    document.getElementById('serialNumber').value = w.serialNumber || '';
                    document.getElementById('caseSize').value = w.caseSize || '';
                    document.getElementById('lugWidth').value = w.lugWidth || '';
                    document.getElementById('crystalType').value = w.crystalType || '';
                    document.getElementById('bandMaterial').value = w.bandMaterial || '';
                    document.getElementById('waterResistance').value = w.waterResistance || '';
                    document.getElementById('caseMaterial').value = w.caseMaterial || '';
                    document.getElementById('purchaseDate').value = w.purchaseDate || '';
                    document.getElementById('purchasePrice').value = w.purchasePrice || '';
                    document.getElementById('askingPrice').value = w.askingPrice || '';
                    document.getElementById('dateOfManufacture').value = w.dateOfManufacture || '';
                    document.getElementById('description').value = w.description || '';
                    currentTempImages = w.images ? [...w.images] : [];
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Add Watch';
                deleteBtn.classList.add('hidden');
                deleteBtn.classList.remove('block');
                document.getElementById('watchId').value = '';
            }

            renderTempImagePreviews();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
        }

        function deleteCurrentEditingWatch() {
            var id = document.getElementById('watchId').value;
            if (!id) return;
            if (confirm('Are you sure you want to delete this watch from your vault?')) {
                watches = watches.filter(function(w) { return w.id !== parseInt(id); });
                saveWatches();
                closeModal();
            }
        }

        function handleImgs(e) {
            var files = e.target.files;
            if (!files) return;
            Array.from(files).forEach(function(file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    currentTempImages.push(evt.target.result);
                    renderTempImagePreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            currentTempImages.forEach(function(src, index) {
                var div = document.createElement('div');
                div.className = 'relative flex-shrink-0';
                div.innerHTML = `
                    <img src="${src}" class="w-14 h-14 object-cover rounded-xl border border-slate-200 shadow-sm">
                    <button type="button" onclick="removeTempImg(${index})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center font-bold">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        function removeTempImg(idx) {
            currentTempImages.splice(idx, 1);
            renderTempImagePreviews();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            var id = document.getElementById('watchId').value;
            
            var watchObj = {
                id: id ? parseInt(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('category').value,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                caseSize: document.getElementById('caseSize').value,
                lugWidth: document.getElementById('lugWidth').value,
                crystalType: document.getElementById('crystalType').value,
                bandMaterial: document.getElementById('bandMaterial').value,
                waterResistance: document.getElementById('waterResistance').value,
                caseMaterial: document.getElementById('caseMaterial').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                askingPrice: document.getElementById('askingPrice').value,
                dateOfManufacture: document.getElementById('dateOfManufacture').value,
                description: document.getElementById('description').value,
                images: currentTempImages
            };

            if (id) {
                var index = watches.findIndex(function(w) { return w.id === parseInt(id); });
                if (index !== -1) watches[index] = watchObj;
            } else {
                watches.push(watchObj);
            }

            saveWatches();
            closeModal();
        }
        function openDetailModal(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;

            document.getElementById('detTitle').innerText = (w.brand || '') + ' ' + (w.model || '');
            
            var valStr = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : 'N/A';
            var purchaseStr = w.purchasePrice ? '$' + Number(w.purchasePrice).toLocaleString() : 'N/A';
            
            document.getElementById('detVal').innerText = valStr;
            document.getElementById('detPurchase').innerText = purchaseStr;
            document.getElementById('detDesc').innerText = w.description || 'No notes provided.';

            var imgContainer = document.getElementById('detImagesContainer');
            imgContainer.innerHTML = '';
            if (w.images && w.images.length > 0) {
                w.images.forEach(function(src) {
                    var img = document.createElement('img');
                    img.src = src;
                    img.className = 'w-24 h-24 object-cover rounded-2xl glass-inner cursor-pointer flex-shrink-0 hover:opacity-90 transition-all shadow-sm';
                    img.onclick = function() { openLightbox(src); };
                    imgContainer.appendChild(img);
                });
            } else {
                imgContainer.innerHTML = '<div class="text-xs text-slate-500 italic p-2">No images available</div>';
            }

            var specsBox = document.getElementById('detSpecsSection');
            specsBox.innerHTML = `
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-700 glass-inner p-3 rounded-2xl shadow-sm">
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Movement</span>${w.movementType || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Serial Number</span><span class="font-mono">${w.serialNumber || 'N/A'}</span></div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Case Size</span>${w.caseSize || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Lug Width</span>${w.lugWidth || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Crystal</span>${w.crystalType || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Water Resistance</span>${w.waterResistance || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Band Material</span>${w.bandMaterial || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Case Material</span>${w.caseMaterial || 'N/A'}</div>
                </div>
            `;

            document.getElementById('detEditBtn').onclick = function() {
                closeDetailModal();
                openModal(w.id);
            };

            document.getElementById('detShareBtn').onclick = function() {
                openShareModal(w.id);
            };

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
            document.getElementById('lightboxModal').classList.add('flex');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
            document.getElementById('lightboxModal').classList.remove('flex');
        }

        function openShareModal(id) {
            activeShareWatchId = id;
            var w = watches.find(function(item) { return item.id === id; });
            var box = document.getElementById('shareOptionsBox');
            if (w) {
                box.innerHTML = `<p class="font-bold text-slate-900">${w.brand} ${w.model}</p><p class="text-[11px] text-slate-500">Ready to export spec sheet or share details.</p>`;
            }
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareModal').classList.add('flex');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
        }

        function executeShareText() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var text = `${w.brand} ${w.model}\nEst Value: $${w.currentValue}\nPurchase Price: $${w.purchasePrice}\nSerial: ${w.serialNumber}\nMovement: ${w.movementType}`;
            if (navigator.share) {
                navigator.share({ title: w.brand + ' ' + w.model, text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Watch summary copied to clipboard!');
            }
        }

        function executeEmailReport() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var subject = encodeURIComponent(`Watch Details: ${w.brand} ${w.model}`);
            var body = encodeURIComponent(`Brand: ${w.brand}\nModel: ${w.model}\nSerial: ${w.serialNumber}\nEst Value: $${w.currentValue}\nPurchase Price: $${w.purchasePrice}\nCategory: ${w.category}\nCase Size: ${w.caseSize}\nNotes: ${w.description}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function executeGeneratePDF() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var printWin = window.open('', '_blank');
            printWin.document.write(`
                <html>
                <head><title>${w.brand} ${w.model} - Spec Sheet</title></head>
                <body style="font-family: sans-serif; padding: 20px;">
                    <h1>${w.brand} ${w.model}</h1>
                    <hr>
                    <p><strong>Category:</strong> ${w.category}</p>
                    <p><strong>Estimated Value:</strong> $${w.currentValue}</p>
                    <p><strong>Purchase Price:</strong> ${w.purchasePrice}</p>
                    <p><strong>Serial Number:</strong> ${w.serialNumber}</p>
                    <p><strong>Movement:</strong> ${w.movementType}</p>
                    <p><strong>Case Size:</strong> ${w.caseSize} | <strong>Lug Width:</strong> ${w.lugWidth}</p>
                    <p><strong>Notes:</strong> ${w.description}</p>
                </body>
                </html>
            `);
            printWin.document.close();
            printWin.print();
        }

        function exportBackup() {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watches, null, 2));
            var dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `watch_vault_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importBackup(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    var imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        watches = imported;
                        saveWatches();
                        alert('Backup successfully restored!');
                    }
                } catch(err) {
                    alert('Invalid JSON backup file');
                }
            };
            reader.readAsText(file);
        }

        // Initialize display
        renderWatches();
    </script>
</body>
</html>
