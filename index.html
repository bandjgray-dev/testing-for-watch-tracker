<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watch Vault Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12 font-sans antialiased">
    <div class="max-w-md mx-auto px-4 py-4 space-y-4">

        <!-- Top Header & Actions -->
        <header class="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent flex items-center gap-2">
                <span>⌚</span> Watch Vault
            </h1>
            <button onclick="openModal()" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-4 py-2 rounded-full shadow-md active:scale-95 transition-all">
                + Add Watch
            </button>
        </header>

        <!-- Search Bar -->
        <div class="relative">
            <input type="text" id="searchInput" oninput="renderWatches()" placeholder="Search brand, model, serial..." class="w-full bg-slate-900 border border-slate-800 text-slate-100 placeholder-slate-500 text-xs rounded-xl pl-9 pr-4 py-2.5 focus:outline-none focus:border-indigo-500">
            <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
        </div>

        <!-- Backup & Restore Bar -->
        <div class="grid grid-cols-2 gap-2">
            <button onclick="exportBackup()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all flex items-center justify-center gap-1">
                <span>📥</span> Export Backup
            </button>
            <button onclick="document.getElementById('importFile').click()" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 text-slate-300 font-medium text-xs py-2 rounded-xl text-center active:scale-95 transition-all flex items-center justify-center gap-1">
                <span>📤</span> Restore Backup
            </button>
            <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
        </div>

        <!-- Horizontal Scroll Category Bar -->
        <div class="flex gap-2 overflow-x-auto no-scrollbar py-1" id="catFilters">
            <button onclick="setFilter('All', this)" class="filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all">All</button>
            <button onclick="setFilter('Diver', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Diver</button>
            <button onclick="setFilter('Dress', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Dress</button>
            <button onclick="setFilter('Chronograph', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Chronograph</button>
            <button onclick="setFilter('Field', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Field</button>
            <button onclick="setFilter('Vintage', this)" class="filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all">Vintage</button>
        </div>

        <!-- Watch Cards Container -->
        <div id="watchList" class="space-y-4"></div>
    </div>
    <!-- Add / Edit Watch Modal -->
    <div id="watchModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl">
            <h2 id="modalTitle" class="text-lg font-bold text-white mb-4">Add Watch</h2>
            <form id="watchForm" onsubmit="handleFormSubmit(event)" class="space-y-3">
                <input type="hidden" id="watchId">
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Brand</label>
                        <input type="text" id="brand" required placeholder="Rolex" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Model</label>
                        <input type="text" id="model" required placeholder="Submariner" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Category</label>
                        <select id="category" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                            <option value="Diver">Diver</option>
                            <option value="Dress">Dress</option>
                            <option value="Chronograph">Chronograph</option>
                            <option value="Field">Field</option>
                            <option value="Vintage">Vintage</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Value ($)</label>
                        <input type="number" id="currentValue" placeholder="14500" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Movement</label>
                        <input type="text" id="movementType" placeholder="Automatic 3235" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Serial Number</label>
                        <input type="text" id="serialNumber" placeholder="X829F114" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Size</label>
                        <input type="text" id="caseSize" placeholder="41mm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Lug Width</label>
                        <input type="text" id="lugWidth" placeholder="20mm" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Crystal Type</label>
                        <input type="text" id="crystalType" placeholder="Sapphire" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Band Material</label>
                        <input type="text" id="bandMaterial" placeholder="Steel Oyster" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Water Resistance</label>
                        <input type="text" id="waterResistance" placeholder="300m" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Case Material</label>
                        <input type="text" id="caseMaterial" placeholder="Stainless Steel" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Purchase Date</label>
                        <input type="date" id="purchaseDate" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Purchase Price ($)</label>
                        <input type="number" id="purchasePrice" placeholder="10200" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Asking Price ($)</label>
                        <input type="number" id="askingPrice" placeholder="15000" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Mfg Date / Year</label>
                        <input type="text" id="dateOfManufacture" placeholder="2022" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                    </div>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Notes</label>
                    <textarea id="description" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                </div>
                <div>
                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Images</label>
                    <input type="file" id="imgs" accept="image/*" multiple onchange="handleImgs(event)" class="w-full text-xs text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500">
                    <div id="imagePreviewContainer" class="flex gap-2 overflow-x-auto py-2"></div>
                </div>
                <div class="flex justify-end gap-2 pt-3">
                    <button type="button" onclick="closeModal()" class="bg-slate-800 text-slate-300 font-semibold text-xs px-4 py-2.5 rounded-xl">Cancel</button>
                    <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs px-5 py-2.5 rounded-xl shadow-md">Save Watch</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Expanded Detail Modal -->
    <div id="detailModal" class="hidden fixed inset-0 bg-black/85 backdrop-blur-sm z-50 items-center justify-center p-4 overflow-y-auto">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-md max-h-[90vh] overflow-y-auto p-6 shadow-2xl space-y-4">
            <div class="flex justify-end items-center">
                <button onclick="closeDetailModal()" class="bg-slate-800 text-slate-400 hover:text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">&times;</button>
            </div>
            
            <div id="detImagesContainer" class="flex gap-2 overflow-x-auto no-scrollbar py-1"></div>

            <div>
                <h2 id="detTitle" class="text-lg font-bold text-white tracking-wide"></h2>
            </div>

            <div class="grid grid-cols-2 gap-2 bg-slate-950 p-3 rounded-2xl border border-slate-800/80 text-xs">
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Estimated Value</span><span id="detVal" class="text-emerald-400 font-bold text-sm"></span></div>
                <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Movement</span><span id="detMovement" class="text-slate-200 font-medium"></span></div>
                <div class="col-span-2 pt-1 border-t border-slate-900"><span class="text-slate-500 block uppercase text-[9px] font-bold">Serial Number</span><span id="detSerial" class="text-slate-300 font-mono"></span></div>
            </div>

            <div id="detSpecsSection"></div>

            <div>
                <h4 class="text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Notes</h4>
                <p id="detDesc" class="text-xs text-slate-300 leading-relaxed bg-slate-950 p-3 rounded-2xl border border-slate-800/80"></p>
            </div>

            <div class="flex gap-2 pt-2">
                <button type="button" id="detEditBtn" class="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs py-2.5 rounded-xl transition-all">Edit Watch</button>
                <button type="button" id="detShareBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl transition-all">Share / Export</button>
            </div>
        </div>
    </div>

    <!-- Fullscreen Lightbox Modal -->
    <div id="lightboxModal" class="hidden fixed inset-0 bg-black/95 z-[100] items-center justify-center p-2" onclick="closeLightbox()">
        <button class="absolute top-4 right-4 bg-slate-800 text-white w-10 h-10 rounded-full font-bold text-lg flex items-center justify-center shadow-lg">&times;</button>
        <img id="lightboxImg" src="" class="max-w-full max-h-full object-contain rounded-xl shadow-2xl">
    </div>

    <!-- Share & PDF Report Modal -->
    <div id="shareModal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 text-slate-100 rounded-3xl w-full max-w-sm p-6 shadow-2xl space-y-4">
            <h3 class="text-base font-bold text-white">Share / Export Options</h3>
            <div id="shareOptionsBox" class="space-y-2 max-h-48 overflow-y-auto text-xs text-slate-300 pr-1"></div>
            <div class="flex flex-col gap-2 pt-2">
                <button type="button" onclick="executeShareText()" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-semibold text-xs py-2.5 rounded-xl">Share Text (SMS / App)</button>
                <button type="button" onclick="executeEmailReport()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs py-2.5 rounded-xl">Email Details</button>
                <button type="button" onclick="executeGeneratePDF()" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-semibold text-xs py-2.5 rounded-xl">Download Spec Sheet</button>
                <button type="button" onclick="closeShareModal()" class="w-full bg-slate-950 text-slate-400 font-semibold text-xs py-2 rounded-xl mt-1">Cancel</button>
            </div>
        </div>
    </div>
    <script>
        var defaultWatches = [
            {
                id: 101,
                brand: "Rolex",
                model: "Submariner Date",
                category: "Diver",
                currentValue: "14500",
                movementType: "Automatic (3235)",
                serialNumber: "X829F114",
                caseSize: "41mm",
                lugWidth: "20mm",
                crystalType: "Sapphire",
                bandMaterial: "Steel Oyster",
                waterResistance: "300m",
                caseMaterial: "Stainless Steel",
                purchaseDate: "2023-01-15",
                purchasePrice: "10200",
                askingPrice: "14500",
                dateOfManufacture: "2022",
                description: "Black dial, Cerachrom bezel. Daily driver.",
                images: ["https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600&auto=format&fit=crop&q=80"]
            }
        ];

        var stored = localStorage.getItem('watches_v15');
        var watches = [];
        try {
            watches = stored ? JSON.parse(stored) : defaultWatches;
            if (!Array.isArray(watches)) watches = defaultWatches;
        } catch(e) {
            watches = defaultWatches;
        }
        localStorage.setItem('watches_v15', JSON.stringify(watches));

        var currentTempImages = [];
        var activeCategoryFilter = 'All';
        var activeShareWatchId = null;

        function saveWatches() {
            localStorage.setItem('watches_v15', JSON.stringify(watches));
            renderWatches();
        }

        function setFilter(category, element) {
            activeCategoryFilter = category;
            document.querySelectorAll('.filter-btn').forEach(function(btn) {
                btn.className = 'filter-btn bg-slate-900 text-slate-400 hover:text-slate-200 text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-slate-800 shadow-sm transition-all';
            });
            element.className = 'filter-btn active bg-indigo-600 text-white text-xs font-semibold px-4 py-2 rounded-full whitespace-nowrap border border-indigo-500 shadow-sm transition-all';
            renderWatches();
        }
        function renderWatches() {
            var container = document.getElementById('watchList');
            container.innerHTML = '';

            var searchVal = (document.getElementById('searchInput')?.value || '').toLowerCase();

            var filtered = watches.filter(function(w) {
                var matchesCat = activeCategoryFilter === 'All' || w.category === activeCategoryFilter;
                var matchesSearch = !searchVal || 
                    (w.brand && w.brand.toLowerCase().includes(searchVal)) ||
                    (w.model && w.model.toLowerCase().includes(searchVal)) ||
                    (w.serialNumber && w.serialNumber.toLowerCase().includes(searchVal));
                return matchesCat && matchesSearch;
            });

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 bg-slate-900/50 rounded-2xl border border-slate-800/50">
                        <p class="text-slate-400 text-xs">No watches found</p>
                    </div>`;
                return;
            }

            filtered.forEach(function(w) {
                var card = document.createElement('div');
                card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-md flex gap-4 cursor-pointer hover:border-slate-700 transition-all';
                card.onclick = function() { openDetailModal(w.id); };

                var imgUrl = (w.images && w.images.length > 0) ? w.images[0] : 'https://via.placeholder.com/100?text=Watch';
                var valStr = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : 'N/A';

                card.innerHTML = `
                    <img src="${imgUrl}" class="w-20 h-20 object-cover rounded-xl border border-slate-800 bg-slate-950 flex-shrink-0">
                    <div class="flex-1 min-w-0 flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start">
                                <span class="text-[10px] font-bold uppercase tracking-wider text-indigo-400">${w.category || 'Watch'}</span>
                                <span class="text-xs font-bold text-emerald-400">${valStr}</span>
                            </div>
                            <h3 class="text-sm font-bold text-white truncate">${w.brand || ''}</h3>
                            <p class="text-xs text-slate-400 truncate">${w.model || ''}</p>
                        </div>
                        <div class="flex justify-between items-center text-[10px] text-slate-500 pt-1 border-t border-slate-800/60 mt-1">
                            <span>Size: ${w.caseSize || 'N/A'}</span>
                            <span>SN: ${w.serialNumber || 'N/A'}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        function openModal(watchId) {
            var modal = document.getElementById('watchModal');
            var form = document.getElementById('watchForm');
            form.reset();
            currentTempImages = [];

            if (watchId) {
                document.getElementById('modalTitle').innerText = 'Edit Watch';
                var w = watches.find(function(item) { return item.id === watchId; });
                if (w) {
                    document.getElementById('watchId').value = w.id;
                    document.getElementById('brand').value = w.brand || '';
                    document.getElementById('model').value = w.model || '';
                    document.getElementById('category').value = w.category || 'Diver';
                    document.getElementById('currentValue').value = w.currentValue || '';
                    document.getElementById('movementType').value = w.movementType || '';
                    document.getElementById('serialNumber').value = w.serialNumber || '';
                    document.getElementById('caseSize').value = w.caseSize || '';
                    document.getElementById('lugWidth').value = w.lugWidth || '';
                    document.getElementById('crystalType').value = w.crystalType || '';
                    document.getElementById('bandMaterial').value = w.bandMaterial || '';
                    document.getElementById('waterResistance').value = w.waterResistance || '';
                    document.getElementById('caseMaterial').value = w.caseMaterial || '';
                    document.getElementById('purchaseDate').value = w.purchaseDate || '';
                    document.getElementById('purchasePrice').value = w.purchasePrice || '';
                    document.getElementById('askingPrice').value = w.askingPrice || '';
                    document.getElementById('dateOfManufacture').value = w.dateOfManufacture || '';
                    document.getElementById('description').value = w.description || '';
                    currentTempImages = w.images ? [...w.images] : [];
                }
            } else {
                document.getElementById('modalTitle').innerText = 'Add Watch';
                document.getElementById('watchId').value = '';
            }

            renderTempImagePreviews();
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            document.getElementById('watchModal').classList.add('hidden');
            document.getElementById('watchModal').classList.remove('flex');
        }

        function handleImgs(e) {
            var files = e.target.files;
            if (!files) return;
            Array.from(files).forEach(function(file) {
                var reader = new FileReader();
                reader.onload = function(evt) {
                    currentTempImages.push(evt.target.result);
                    renderTempImagePreviews();
                };
                reader.readAsDataURL(file);
            });
        }

        function renderTempImagePreviews() {
            var container = document.getElementById('imagePreviewContainer');
            container.innerHTML = '';
            currentTempImages.forEach(function(src, index) {
                var div = document.createElement('div');
                div.className = 'relative flex-shrink-0';
                div.innerHTML = `
                    <img src="${src}" class="w-14 h-14 object-cover rounded-xl border border-slate-700">
                    <button type="button" onclick="removeTempImg(${index})" class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center font-bold">&times;</button>
                `;
                container.appendChild(div);
            });
        }

        function removeTempImg(idx) {
            currentTempImages.splice(idx, 1);
            renderTempImagePreviews();
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            var id = document.getElementById('watchId').value;
            
            var watchObj = {
                id: id ? parseInt(id) : Date.now(),
                brand: document.getElementById('brand').value,
                model: document.getElementById('model').value,
                category: document.getElementById('category').value,
                currentValue: document.getElementById('currentValue').value,
                movementType: document.getElementById('movementType').value,
                serialNumber: document.getElementById('serialNumber').value,
                caseSize: document.getElementById('caseSize').value,
                lugWidth: document.getElementById('lugWidth').value,
                crystalType: document.getElementById('crystalType').value,
                bandMaterial: document.getElementById('bandMaterial').value,
                waterResistance: document.getElementById('waterResistance').value,
                caseMaterial: document.getElementById('caseMaterial').value,
                purchaseDate: document.getElementById('purchaseDate').value,
                purchasePrice: document.getElementById('purchasePrice').value,
                askingPrice: document.getElementById('askingPrice').value,
                dateOfManufacture: document.getElementById('dateOfManufacture').value,
                description: document.getElementById('description').value,
                images: currentTempImages
            };

            if (id) {
                var index = watches.findIndex(function(w) { return w.id === parseInt(id); });
                if (index !== -1) watches[index] = watchObj;
            } else {
                watches.push(watchObj);
            }

            saveWatches();
            closeModal();
        }
        function openDetailModal(id) {
            var w = watches.find(function(item) { return item.id === id; });
            if (!w) return;

            document.getElementById('detTitle').innerText = (w.brand || '') + ' ' + (w.model || '');
            document.getElementById('detVal').innerText = w.currentValue ? '$' + Number(w.currentValue).toLocaleString() : 'N/A';
            document.getElementById('detMovement').innerText = w.movementType || 'N/A';
            document.getElementById('detSerial').innerText = w.serialNumber || 'N/A';
            document.getElementById('detDesc').innerText = w.description || 'No notes provided.';

            var imgContainer = document.getElementById('detImagesContainer');
            imgContainer.innerHTML = '';
            if (w.images && w.images.length > 0) {
                w.images.forEach(function(src) {
                    var img = document.createElement('img');
                    img.src = src;
                    img.className = 'w-24 h-24 object-cover rounded-xl border border-slate-800 cursor-pointer flex-shrink-0';
                    img.onclick = function() { openLightbox(src); };
                    imgContainer.appendChild(img);
                });
            } else {
                imgContainer.innerHTML = '<div class="text-xs text-slate-500 italic p-2">No images available</div>';
            }

            var specsBox = document.getElementById('detSpecsSection');
            specsBox.innerHTML = `
                <div class="grid grid-cols-2 gap-2 text-xs text-slate-300 bg-slate-950 p-3 rounded-2xl border border-slate-800/80">
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Case Size</span>${w.caseSize || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Lug Width</span>${w.lugWidth || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Crystal</span>${w.crystalType || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Water Resistance</span>${w.waterResistance || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Band Material</span>${w.bandMaterial || 'N/A'}</div>
                    <div><span class="text-slate-500 block uppercase text-[9px] font-bold">Case Material</span>${w.caseMaterial || 'N/A'}</div>
                </div>
            `;

            document.getElementById('detEditBtn').onclick = function() {
                closeDetailModal();
                openModal(w.id);
            };

            document.getElementById('detShareBtn').onclick = function() {
                openShareModal(w.id);
            };

            document.getElementById('detailModal').classList.remove('hidden');
            document.getElementById('detailModal').classList.add('flex');
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
            document.getElementById('detailModal').classList.remove('flex');
        }

        function openLightbox(src) {
            document.getElementById('lightboxImg').src = src;
            document.getElementById('lightboxModal').classList.remove('hidden');
            document.getElementById('lightboxModal').classList.add('flex');
        }

        function closeLightbox() {
            document.getElementById('lightboxModal').classList.add('hidden');
            document.getElementById('lightboxModal').classList.remove('flex');
        }

        function openShareModal(id) {
            activeShareWatchId = id;
            var w = watches.find(function(item) { return item.id === id; });
            var box = document.getElementById('shareOptionsBox');
            if (w) {
                box.innerHTML = `<p class="font-bold text-white">${w.brand} ${w.model}</p><p class="text-[11px] text-slate-400">Ready to export spec sheet or share details.</p>`;
            }
            document.getElementById('shareModal').classList.remove('hidden');
            document.getElementById('shareModal').classList.add('flex');
        }

        function closeShareModal() {
            document.getElementById('shareModal').classList.add('hidden');
            document.getElementById('shareModal').classList.remove('flex');
        }

        function executeShareText() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var text = `${w.brand} ${w.model}\nValue: $${w.currentValue}\nSerial: ${w.serialNumber}\nMovement: ${w.movementType}`;
            if (navigator.share) {
                navigator.share({ title: w.brand + ' ' + w.model, text: text });
            } else {
                navigator.clipboard.writeText(text);
                alert('Watch summary copied to clipboard!');
            }
        }

        function executeEmailReport() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var subject = encodeURIComponent(`Watch Details: ${w.brand} ${w.model}`);
            var body = encodeURIComponent(`Brand: ${w.brand}\nModel: ${w.model}\nSerial: ${w.serialNumber}\nEst Value: $${w.currentValue}\nCategory: ${w.category}\nCase Size: ${w.caseSize}\nNotes: ${w.description}`);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function executeGeneratePDF() {
            var w = watches.find(function(item) { return item.id === activeShareWatchId; });
            if (!w) return;
            var printWin = window.open('', '_blank');
            printWin.document.write(`
                <html>
                <head><title>${w.brand} ${w.model} - Spec Sheet</title></head>
                <body style="font-family: sans-serif; padding: 20px;">
                    <h1>${w.brand} ${w.model}</h1>
                    <hr>
                    <p><strong>Category:</strong> ${w.category}</p>
                    <p><strong>Estimated Value:</strong> $${w.currentValue}</p>
                    <p><strong>Serial Number:</strong> ${w.serialNumber}</p>
                    <p><strong>Movement:</strong> ${w.movementType}</p>
                    <p><strong>Case Size:</strong> ${w.caseSize} | <strong>Lug Width:</strong> ${w.lugWidth}</p>
                    <p><strong>Notes:</strong> ${w.description}</p>
                </body>
                </html>
            `);
            printWin.document.close();
            printWin.print();
        }

        function exportBackup() {
            var dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(watches, null, 2));
            var dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `watch_vault_backup_${Date.now()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function importBackup(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(evt) {
                try {
                    var imported = JSON.parse(evt.target.result);
                    if (Array.isArray(imported)) {
                        watches = imported;
                        saveWatches();
                        alert('Backup successfully restored!');
                    }
                } catch(err) {
                    alert('Invalid JSON backup file');
                }
            };
            reader.readAsText(file);
        }

        // Initialize display on startup
        renderWatches();
    </script>
</body>
</html>
